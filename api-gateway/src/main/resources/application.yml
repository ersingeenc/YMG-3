spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

            - id: workspace-service
              uri: http://localhost:8082
              predicates:
                - Path=/workspaces/**

            - id: task-service
              uri: http://localhost:8083
              predicates:
                - Path=/tasks/**

            - id: status-service
              uri: http://localhost:8084
              predicates:
                - Path=/statuses/**

server:
  port: 8080